# Run with: podman-compose up -d
# (podman-compose is mostly drop-in compatible with docker-compose files;
#  for a more "native" Podman setup on a systemd host, consider converting
#  this to Quadlet .container units later — see docs/ARCHITECTURE.md)

version: "3.8"

networks:
  openlocalai_net:
    driver: bridge

volumes:
  openlocalai_models:
  openlocalai_qdrant_data:
  openlocalai_searxng_data:
  openlocalai_store_pg_data:
  openlocalai_webui_data:

services:
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama
    networks: [openlocalai_net]
    environment:
      # Prevents multiple models being loaded/inferencing concurrently on
      # CPU-only single-node hosts, which was found to saturate all cores
      # and severely degrade response latency (two 100%-CPU llama-server
      # processes fighting for the same cores). See docs/ARCHITECTURE.md
      # and the error/solution table in the deployment guide.
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=2m
    volumes:
      - openlocalai_models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    # Pull models after first start:
    #   podman exec -it ollama ollama pull qwen2.5:14b
    #   podman exec -it ollama ollama pull granite3-dense:8b
    #   podman exec -it ollama ollama pull nomic-embed-text

  qdrant:
    image: docker.io/qdrant/qdrant:latest
    container_name: qdrant
    networks: [openlocalai_net]
    volumes:
      - openlocalai_qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    restart: unless-stopped

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    networks: [openlocalai_net]
    volumes:
      - openlocalai_searxng_data:/etc/searxng
    ports:
      - "8081:8080"
    restart: unless-stopped

  store-postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: store_postgres
    networks: [openlocalai_net]
    env_file: .env
    environment:
      - POSTGRES_USER=${STORE_PG_USER}
      - POSTGRES_PASSWORD=${STORE_PG_PASSWORD}
      - POSTGRES_DB=openlocalai
    volumes:
      - openlocalai_store_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: containers/Containerfile.agent
    container_name: openlocalai_agent
    networks: [openlocalai_net]
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "8000:8000"
    depends_on:
      - ollama
      - qdrant
      - searxng
      - store-postgres
    restart: unless-stopped

  webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openlocalai_webui
    networks: [openlocalai_net]
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - openlocalai_webui_data:/app/backend/data
    ports:
      - "8080:8080"
    depends_on:
      - ollama
    restart: unless-stopped
